name: Sovereign Quant OS Viral Showcase & Hardware Simulation Circuit
on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-showcase-and-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio cryptography
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Validate Viral Showcase Primitives
        shell: bash
        run: |
          test -f llms.txt || exit 1
          test -f assets/scorecard.svg || exit 1
          test -f showcase.html || exit 1
          test -f db/STRESS_BENCHMARK_REAL_WHEELS.json || exit 1
          echo "Showcase assets verified."
      - name: Execute Kernel Stress & Idempotency Battery
        shell: bash
        run: |
          pytest -o asyncio_mode=auto test_execution_kernel_stress.py
      - name: Execute Domain Risk Gate Benchmark Reproducer
        shell: bash
        run: |
          python3 scripts/run_benchmark_with_tombstone.py \
            --repo "rajon369963-del/sovereign-quant-os" \
            --benchmark-cmd "python3 scripts/benchmark_quant_risk_gate.py" \
            --expected-output "scripts/quant_benchmark_results.json" \
            --status-output "scripts/benchmark_status.json" \
            --stdout-log "scripts/benchmark_stdout.log" \
            --stderr-log "scripts/benchmark_stderr.log"

      - name: Upload Live Benchmark Artifact (Preserve Evidence Even on Failure)
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: live-quant-benchmark-results
          path: |
            scripts/quant_benchmark_results.json
            scripts/benchmark_status.json
            scripts/benchmark_stdout.log
            scripts/benchmark_stderr.log
          if-no-files-found: error
          retention-days: 90

      - name: Run Permanent Adversarial Canary Regression Suite
        shell: bash
        run: |
          python3 tests/test_adversarial_receipt_canaries.py

      - name: Verify Cryptographic Receipt & Scorecard Zero-Drift
        shell: bash
        run: |
          set -o pipefail
          set +e
          python3 scripts/verify_receipt.py --assert-live-benchmark scripts/quant_benchmark_results.json 2>&1 | tee /tmp/quant_forensic_verification_report.txt
          verifier_rc=${PIPESTATUS[0]}
          printf '\nVERIFIER_EXIT_CODE=%s\n' "$verifier_rc" | tee -a /tmp/quant_forensic_verification_report.txt
          exit "$verifier_rc"

      - name: Verify Federation Evidence Manifest
        shell: bash
        run: |
          python3 scripts/verify_federation_manifest.py --verify federation-evidence-manifest.json --repo sovereign-quant-os

      - name: Upload Forensic Verification Report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: quant-forensic-verification-report
          path: /tmp/quant_forensic_verification_report.txt
          if-no-files-found: error
          retention-days: 90
