name: Sovereign Quant OS Viral Showcase & Hardware Simulation Circuit
on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-showcase-and-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Validate Viral Showcase Primitives
        run: |
          test -f llms.txt || exit 1
          test -f assets/scorecard.svg || exit 1
          test -f showcase.html || exit 1
          echo "Showcase assets verified."
      - name: Execute Kernel Stress & Idempotency Battery
        run: |
          pytest -o asyncio_mode=auto test_execution_kernel_stress.py
      - name: Verify Cryptographic Receipt & Scorecard Zero-Drift
        run: |
          pip install cryptography
          python3 scripts/verify_receipt.py
