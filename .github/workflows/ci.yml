name: Sovereign Quant OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IC² Compound Synthesis Engine (12 Clusters)
        run: python3 ic2_interconnection_engine.py

      - name: Run Async L2 DMA Gateway Battery
        run: python3 test_async_l2_dma_battery.py

      - name: Run Wire Bridge & In-Flight Concurrency Battery
        run: python3 test_wire_bridge_and_reconciliation_battery.py

      - name: Run Partial-Fill Event Identity & Idempotency Battery
        run: python3 test_partial_fill_lifecycle.py

      - name: Run Order Intent Identity & Same-Millisecond Collision Court
        run: python3 test_order_intent_identity.py

      - name: Run Daily-Risk Session & Policy Restart Court
        run: python3 test_daily_risk_session_policy.py

      - name: Run Delta-Neutral Carry Harvester Battery
        run: python3 test_phase3_cherry_on_top_battery.py

      - name: Run 10x Canary & 10,000-Order Stress Runner
        run: python3 sovereign_100_hacks_100_wheels_full_synthesis.py --verify-only
