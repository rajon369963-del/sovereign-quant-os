name: Sovereign Quant OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record tested revision
        run: |
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          git status --short

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dhan Simulation/Live Authority Court
        run: |
          python3 tests/test_dhan_mode_authority.py
          python3 tests/test_dhan_mode_authority_kill_mutants.py

      - name: Run Execution Family Hostile Court (Quant #14, #16, #18, #27, #36)
        run: python3 tests/test_execution_family_hostile_court.py

      - name: Run Execution Intent Identity Court (Issue #62)
        run: python3 tests/test_execution_intent_identity.py

      - name: Run IC² Compound Synthesis Engine (12 Clusters)
        run: python3 ic2_interconnection_engine.py

      - name: Run Async L2 DMA Gateway Battery
        run: python3 test_async_l2_dma_battery.py

      - name: Run Wire Bridge & In-Flight Concurrency Battery
        run: python3 test_wire_bridge_and_reconciliation_battery.py

      - name: Run Delta-Neutral Carry Harvester Battery
        run: python3 test_phase3_cherry_on_top_battery.py

      - name: Run 10x Canary & 10,000-Order Stress Runner
        run: python3 sovereign_100_hacks_100_wheels_full_synthesis.py --verify-only
