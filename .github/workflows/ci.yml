name: Sovereign Quant OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IC² Compound Synthesis Engine (12 Clusters)
        run: python3 ic2_interconnection_engine.py

      - name: Run Async L2 DMA Gateway Battery
        run: python3 test_async_l2_dma_battery.py

      - name: Run Wire Bridge & In-Flight Concurrency Battery
        run: python3 test_wire_bridge_and_reconciliation_battery.py

      - name: Run Circuit Breaker Durability Battery
        run: python3 test_circuit_breaker_durable_reconciliation.py

      - name: Run restart and venue preflight regression tests
        run: python3 -m unittest test_restart_hold test_venue_constraint_preflight

      - name: Run Delta-Neutral Carry Harvester Battery
        run: python3 test_phase3_cherry_on_top_battery.py

      - name: Run 10x Canary & 10,000-Order Stress Runner
        run: python3 sovereign_100_hacks_100_wheels_full_synthesis.py --verify-only
